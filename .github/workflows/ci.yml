name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Unit and mock end-to-end tests
        run: pytest -q

      - name: Smoke test without an API key
        run: python demo_code.py --provider mock --limit 5 --output /tmp/smoke.jsonl --quiet

      - name: Validate committed results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              json.loads(line)
              for line in Path("outputs/predictions_hinted.jsonl")
              .read_text(encoding="utf-8")
              .splitlines()
          ]
          assert len(rows) == 231, len(rows)
          assert all(row["predicted_label"] for row in rows)
          metrics = json.loads(
              Path("outputs/predictions_hinted.metrics.json").read_text(encoding="utf-8")
          )
          assert metrics["summary"]["correct"] == 194
          assert abs(metrics["summary"]["accuracy"] - 0.8398) < 1e-9
          print("committed artifacts OK")
          PY
